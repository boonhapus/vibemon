[project]
name = "vibemon-backend"
version = "0.1.0"
description = "Vibemon Litestar API"
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "python-dotenv>=1.0.0",
    "rembg[cpu]>=2.0.50",
    "cattrs>=26.1.0",
    "litestar>=2.21.1",
    "niquests>=3.18.5",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.44.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]

[project.scripts]
vibemon-generate = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
docstring-code-format = true
