[project]
name = "vibemon-backend"
version = "0.1.0"
description = "Vibemon Litestar API"
requires-python = ">=3.14"
dependencies = [
    "niquests>=3.18.5",
    "structlog>=25.5.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.85.1",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "numpy>=2.4.4",
    "elevenlabs>=1.15.0",
    "annotated-types>=0.7.0",
    "scipy>=1.17.1",
    "pillow>=12.2.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "obstore>=0.9.4",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "pre-commit>=4.0.0",
    "pyrefly>=0.65.0",
    "cyclopts>=4.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.pyrefly]
check-unannotated-defs = true

[tool.pyrefly.errors]
implicit-any = true

[tool.skylos]
# Quality thresholds
complexity = 10        # max cyclomatic complexity per function
nesting = 3            # max nesting depth
max_args = 5           # max function parameters
max_lines = 50         # max function length
duplicate_strings = 3  # flag string literals repeated this many times
ignore = [
    "SKY-D223",  # https://docs.skylos.dev/rules-reference#sky-d223--undeclared-dependency
    "SKY-Q802",  # https://docs.skylos.dev/rules-reference#sky-q802--distance-from-main-sequence
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
from-first = true
split-on-trailing-comma = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade (modernize syntax for your target version)
    "B",     # flake8-bugbear (common pitfalls)
    "SIM",   # flake8-simplify
    "PT",    # flake8-pytest-style (since you're using pytest)
    "RUF",   # ruff-specific rules
]
ignore = [
    "B008",  # function-call-in-default-argument
]
