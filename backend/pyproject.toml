[project]
name = "vibemon-backend"
version = "0.1.0"
description = "Vibemon Litestar API"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "rembg[cpu]>=2.0.50",
    "litestar>=2.21.1",
    "niquests>=3.18.5",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.44.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.85.1",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "numpy>=2.4.4",
    "elevenlabs>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
docstring-code-format = true
