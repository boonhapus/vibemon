[project]
name = "vibemon-cutout"
version = "0.1.0"
description = "BBox-guided rembg cutout tool for Vibemon sprites"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.10.2",
    "numpy>=2.0.0",
    "onnxruntime>=1.20.0",
    "pillow>=12.2.0",
    "rembg>=2.0.50",
    "structlog>=25.5.0",
]

[project.scripts]
app = "server:main"
cli = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["cli.py", "server.py", "core.py", "web.py", "paths.py"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "static"
