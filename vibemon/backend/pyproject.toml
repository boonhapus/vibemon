[project]
name = "vibemon-backend"
version = "0.1.0"
description = "Vibemon Litestar API"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=44.0.0",
    "astral>=3.2",
    "elevenlabs>=1.15.0",
    "jinja2>=3.1.6",
    "niquests>=3.18.5",
    "niquests-cache>=0.2.4",
    "numpy>=2.4.4",
    "obstore>=0.9.4",
    "openai>=2.32.0",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.85.1",
    "pydantic-settings>=2.14.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "cyclopts>=4.10.2",
    "deptry>=0.25.1",
    "pre-commit>=4.0.0",
    "pyrefly>=0.65.0",
    "pytest>=9.0.3",
    "fakeredis>=2.26.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "skylos>=4.14.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
    "testcontainers>=4.14.2",
    "testcontainers-postgres>=0.0.1rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/providers/biome/data" = "app/providers/biome/data"
"app/providers/music/data" = "app/providers/music/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater\\.:UserWarning:elevenlabs\\.core\\.pydantic_utilities",
]

[tool.pyrefly]
check-unannotated-defs = true

[tool.pyrefly.errors]
implicit-any = true

[tool.deptry.per_rule_ignores]
DEP004 = ["cyclopts"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
from-first = true
split-on-trailing-comma = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade (modernize syntax for your target version)
    "B",     # flake8-bugbear (common pitfalls)
    "SIM",   # flake8-simplify
    "PT",    # flake8-pytest-style (since you're using pytest)
    "RUF",   # ruff-specific rules
]
ignore = [
    "B008",  # function-call-in-default-argument
]

[tool.skylos]
# Quality thresholds
complexity = 10        # max cyclomatic complexity per function
nesting = 3            # max nesting depth
max_args = 5           # max function parameters
max_lines = 50         # max function length
duplicate_strings = 3  # flag string literals repeated this many times
ignore = [
    "SKY-D223",  # https://docs.skylos.dev/rules-reference#sky-d223--undeclared-dependency
    "SKY-Q802",  # https://docs.skylos.dev/rules-reference#sky-q802--distance-from-main-sequence
]

[tool.uv]
exclude-newer = "7 days"

# PyPI jsonschema 4.26.0 fails on Python 3.14 (Mapping only under TYPE_CHECKING).
# Main adds `from __future__ import annotations` in _types.py (7a74932); drop when 4.27 ships.
[tool.uv.sources]
jsonschema = { git = "https://github.com/python-jsonschema/jsonschema", rev = "7a749329061d4e88da6b07ee19b5a674a9e97ba8" }
