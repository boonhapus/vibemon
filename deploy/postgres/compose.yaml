# Local Postgres for vibemon dev (SQLite alternative).
# Usage: see deploy/postgres/README.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibemon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibemon
      POSTGRES_USER: vibemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibemon}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibemon -d vibemon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pg_data:
